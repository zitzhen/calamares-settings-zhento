name: CI

on:
  pull_request:
  push:
    branches: [main, kzhento, 'action/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Gate / build / smoke
    uses: ./.github/workflows/build-and-test.yml
    with:
      artifact-name: ci-debs
